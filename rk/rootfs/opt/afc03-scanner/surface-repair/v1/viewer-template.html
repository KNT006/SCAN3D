<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>补洞结果 · AFC03</title><style>body{margin:0;background:#10222d;color:#e1edf2;font:15px system-ui}header{padding:16px}a{color:#9be8df;margin-right:20px}button,select,input{margin:5px;padding:7px;font:inherit}canvas{width:100vw;height:72vh;touch-action:none}small{color:#b6ccd5}</style><header><a href="/surface">← 局部补洞</a><b>完整点云 FULLCOUNT 点 · 输入 BASECOUNT 点 · 估计 ADDCOUNT 点</b><p>橙色表示算法估计的几何形状，不能当作实测数据。颜色为插值结果。</p><select id="mode"><option value="highlight">高亮估计点</option><option value="color">插值颜色</option><option value="base">仅输入点</option><option value="added">仅估计点</option></select><button id="reset">重置视角</button><label>点大小 <input id="size" type="range" min="1" max="4" value="2"></label><a href="files/model">完整 PLY</a><a href="files/inferred">仅估计点 PLY</a><small>拖动旋转，滚轮缩放；预览输入点已抽样，下载保留全部点。</small></header><canvas id="view"></canvas><script>
const pts=POINTDATA,center=CENTER,radius=RADIUS;let yaw=.5,pitch=-.35,zoom=1,drag=null;const c=document.getElementById('view'),g=c.getContext('2d'),mode=document.getElementById('mode'),size=document.getElementById('size');
function draw(){const r=c.getBoundingClientRect(),d=devicePixelRatio;c.width=r.width*d;c.height=r.height*d;g.scale(d,d);g.fillStyle='#10222d';g.fillRect(0,0,r.width,r.height);const sc=Math.min(r.width,r.height)*.43/radius*zoom,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),out=[];for(const p of pts){const add=p[7]===3;if(mode.value==='base'&&add||mode.value==='added'&&!add)continue;const x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2],u=x*cy-y*sy,v=x*sy+y*cy;out.push([r.width/2+u*sc,r.height/2-(z*cp-v*sp)*sc,v*cp+z*sp,p,add])}out.sort((a,b)=>a[2]-b[2]);for(const [x,y,_,p,add] of out){g.fillStyle=add&&mode.value==='highlight'?'#ff6e23':`rgb(${p[3]},${p[4]},${p[5]})`;g.fillRect(x,y,+size.value,+size.value)}}
c.onpointerdown=e=>{drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.01;pitch+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY];draw()};c.onpointerup=c.onpointercancel=()=>drag=null;c.onwheel=e=>{e.preventDefault();zoom=Math.max(.2,Math.min(8,zoom*Math.exp(-e.deltaY*.001)));draw()};mode.onchange=size.oninput=draw;document.getElementById('reset').onclick=()=>{yaw=.5;pitch=-.35;zoom=1;draw()};window.onresize=draw;draw();
</script></html>
