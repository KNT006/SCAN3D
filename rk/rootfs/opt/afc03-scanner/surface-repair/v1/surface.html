<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点云局部补洞 · AFC03</title>
<style>body{margin:0;background:#eef3f5;color:#19333e;font:16px system-ui}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:26px;margin:12px 0}a{color:#08777b}section{background:white;border-radius:14px;padding:20px;margin:16px 0}button,select,input{font:inherit;padding:8px;border:1px solid #b9cccf;border-radius:6px;margin:4px}button{cursor:pointer;background:#e9f6f4}button:disabled{opacity:.45;cursor:wait}input{width:75px}select{max-width:100%}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}canvas{width:100%;height:380px;background:#10262f;border-radius:8px;touch-action:none}.note{color:#615527;background:#fff6d9;padding:12px;border-radius:8px}#status{white-space:pre-wrap}li{margin:12px 0}.small{font-size:13px;color:#56717b}@media(max-width:850px){.layout{grid-template-columns:1fr}}</style>
<main><a href="/fpga">← 扫描工作台</a><h1>点云局部补洞</h1><p>在 RK3576 上处理已保存的模型。原始点云保留，新增估计点可单独查看、下载。</p>
<p class="note">补洞是形状估计，不是重新测量。当前支持能表示为 Y=f(X,Z) 的局部表面；多层、折叠、深凹面不适合此模式。</p>
<section><label>输入模型 <select id="model"></select></label><button id="load">载入预览</button><button id="preset">鸭子尾部验证预设</button><p id="info" class="small"></p>
<div class="layout"><div><canvas id="map"></canvas><p class="small">XZ 投影：仅显示指定 Y 范围的点。双调和模式可点击圈选缺口，按所选点的凸包填补；需在边界外保留实测点作为支撑。</p><button id="clear">清除圈选</button><span id="vertices"></span></div><div>
<p><label>模式 <select id="method"><option value="mls">MLS · 保守补小缺口</option><option value="biharmonic">双调和 · 平滑估计较大缺口</option></select></label></p>
<p>处理范围（毫米，需包含缺口周围实测点）</p>
<p>X <input id="x0" type="number" value="-24" step=".1"> 至 <input id="x1" type="number" value="24" step=".1"></p>
<p>Y <input id="y0" type="number" value="-62" step=".1"> 至 <input id="y1" type="number" value="-45" step=".1"></p>
<p>Z <input id="z0" type="number" value="-34" step=".1"> 至 <input id="z1" type="number" value="-5" step=".1"></p>
<p>网格间距 <input id="grid" type="number" value="0.2" min="0.2" max="1" step=".1"> mm</p>
<p class="small">MLS 在上述范围内依据邻域支撑补点；双调和仅填圈选区内的缺口。两个模式均要求局部表面接近 XZ 平面。</p>
<button id="run" disabled>生成新结果</button><button id="stop" disabled>停止计算</button></div></div></section>
<section><h2>计算状态</h2><div id="status">尚未开始。</div><div id="links"></div></section>
<section><h2>已保存的结果</h2><ul id="history"></ul></section></main>
<script>
const $=id=>document.getElementById(id);let points=[],poly=[],task=null,timer=null,loaded=null;
async function api(url,options){const r=await fetch(url,options);let d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail||d));return d}
function cfg(){return {model:$('model').value,method:$('method').value,x:[+$('x0').value,+$('x1').value],y:[+$('y0').value,+$('y1').value],z:[+$('z0').value,+$('z1').value],grid:+$('grid').value,polygon_xz:poly}}
function draw(){const c=$('map'),r=c.getBoundingClientRect();c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(r.height*devicePixelRatio);const g=c.getContext('2d');g.scale(devicePixelRatio,devicePixelRatio);const q=cfg(),w=r.width,h=r.height,xy=(x,z)=>[20+(x-q.x[0])/(q.x[1]-q.x[0])*(w-40),h-20-(z-q.z[0])/(q.z[1]-q.z[0])*(h-40)];g.fillStyle='#10262f';g.fillRect(0,0,w,h);for(const p of points){if(p[1]<q.y[0]||p[1]>q.y[1]||p[0]<q.x[0]||p[0]>q.x[1]||p[2]<q.z[0]||p[2]>q.z[1])continue;g.fillStyle=`rgb(${p[3]},${p[4]},${p[5]})`;let [x,y]=xy(p[0],p[2]);g.fillRect(x,y,2,2)}g.strokeStyle='#ff943d';g.fillStyle='#ff943d';g.lineWidth=2;g.beginPath();poly.forEach((p,i)=>{const [x,y]=xy(...p);i?g.lineTo(x,y):g.moveTo(x,y)});if(poly.length>2)g.closePath();g.stroke();poly.forEach(p=>{const [x,y]=xy(...p);g.fillRect(x-3,y-3,6,6)});g.fillStyle='#c8e1e6';g.fillText('X →   Z ↑',16,16);$('vertices').textContent=poly.length+' 个边界点'}
$('map').onclick=e=>{if($('method').value!=='biharmonic')return;const r=e.target.getBoundingClientRect(),q=cfg();const x=q.x[0]+(e.clientX-r.left-20)/(r.width-40)*(q.x[1]-q.x[0]),z=q.z[0]+(r.height-20-e.clientY+r.top)/(r.height-40)*(q.z[1]-q.z[0]);if(x>q.x[0]&&x<q.x[1]&&z>q.z[0]&&z<q.z[1]&&poly.length<30){poly.push([+x.toFixed(2),+z.toFixed(2)]);draw()}};
document.querySelectorAll('input').forEach(e=>e.onchange=draw);window.onresize=draw;$('method').onchange=draw;$('clear').onclick=()=>{poly=[];draw()};$('model').onchange=()=>{$('run').disabled=true;loaded=null};
async function load(){try{$('info').textContent='正在载入…';const d=await api('/api/surface/preview?model='+encodeURIComponent($('model').value));points=d.points;loaded=$('model').value;$('info').textContent=`共 ${d.count.toLocaleString()} 个输入点；预览已抽样。范围只影响补洞，输出保留全部输入点。`;$('run').disabled=false;draw()}catch(e){$('info').textContent=e.message}}
$('load').onclick=load;$('preset').onclick=async()=>{const id='fpga-full-20261003-005504:tail-repaired-v1';if(![...$('model').options].some(o=>o.value===id))return alert('鸭子验证数据不存在');$('model').value=id;$('method').value='biharmonic';for(const [k,v] of Object.entries({x0:-24,x1:24,y0:-62,y1:-45,z0:-34,z1:-5,grid:.2}))$(k).value=v;poly=[[-13,-22],[-10,-26],[0,-28],[8,-26],[13,-21],[12,-17],[6,-13],[0,-11],[-8,-16]];await load()};
function links(id,node){node.replaceChildren();for(const [label,suffix] of [['查看与高亮估计点','viewer'],['完整点云 PLY','files/model'],['橙色估计点 PLY','files/highlight'],['仅估计点 PLY','files/inferred'],['计算报告','files/audit']]){const a=document.createElement('a');a.href='/api/surface/tasks/'+id+'/'+suffix;a.textContent=label;a.style.marginRight='16px';if(suffix==='viewer')a.target='_blank';node.append(a)}}
async function history(){const ds=await api('/api/surface/tasks');$('history').replaceChildren();for(const d of ds){let li=document.createElement('li');li.textContent=`${d.request.method} · ${d.request.model} · ${d.status} `;if(d.status==='complete'){let n=document.createElement('div');links(d.id,n);li.append(n)}$('history').append(li)}}
async function poll(){try{const d=await api('/api/surface/tasks/'+task);$('status').textContent=d.status==='complete'?`完成 · ${d.audit.inferred_points.toLocaleString()} 个估计点 · ${d.performance.elapsed_seconds.toFixed(1)} 秒\n所有输入点保留。估计区域的真实误差未知。`:d.status+' · '+(d.stage||'')+(d.error?'\n'+d.error:'');if(['complete','failed','interrupted'].includes(d.status)){clearInterval(timer);$('stop').disabled=true;$('run').disabled=loaded!==$('model').value;if(d.status==='complete')links(task,$('links'));await history()}}catch(e){$('status').textContent=e.message}}
$('run').onclick=async()=>{try{if(loaded!==$('model').value)throw Error('请先载入当前模型');$('run').disabled=true;$('links').replaceChildren();const d=await api('/api/surface/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg())});task=d.id;$('stop').disabled=false;await poll();timer=setInterval(poll,1500)}catch(e){$('status').textContent=e.message;$('run').disabled=false}};
$('stop').onclick=async()=>{try{await api('/api/surface/tasks/'+task+'/stop',{method:'POST'});await poll()}catch(e){$('status').textContent=e.message}};
(async()=>{try{const ds=await api('/api/surface/models');for(const d of ds){const o=document.createElement('option');o.value=d.id;o.textContent=d.label;$('model').append(o)}await history();draw()}catch(e){$('status').textContent=e.message}})();
</script></html>
